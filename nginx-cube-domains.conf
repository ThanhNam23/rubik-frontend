# Deploy the static files to /var/www/rubik/rubik-frontend.
# Keep the API behind HAProxy/backend; browsers only see same-origin /api/.

server {
    listen 80;
    server_name cube.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cube.local;

    ssl_certificate     /etc/nginx/ssl/lab.crt;
    ssl_certificate_key /etc/nginx/ssl/lab.key;
    root /var/www/rubik/rubik-frontend;
    index index.html;

    # Public users must not reach the admin editor through cube.local.
    location = /admin.html { return 404; }
    location = /admin.js { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name admin.cube.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.cube.local;

    ssl_certificate     /etc/nginx/ssl/lab.crt;
    ssl_certificate_key /etc/nginx/ssl/lab.key;
    root /var/www/rubik/rubik-frontend;
    # Admin opens the editor by default, but can inspect every public page.
    index admin.html;

    # Perimeter protection. The backend must still authenticate and authorize.
    auth_basic "Cube admin";
    auth_basic_user_file /etc/nginx/.htpasswd;
    limit_req zone=admin_limit burst=3 nodelay;
    limit_req_status 429;

    location /api/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Shared user pages remain available on admin.cube.local for review.
    location = /index.html { try_files $uri =404; }
    location = /algorithms.html { try_files $uri =404; }
    location = /notation.html { try_files $uri =404; }
    location = /solver.html { try_files $uri =404; }
    location = /styles.css { try_files $uri =404; }
    location = /script.js { try_files $uri =404; }

    location / {
        try_files $uri $uri/ /admin.html;
    }
}
