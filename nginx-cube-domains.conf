# Deploy the static files to /var/www/rubik/rubik-frontend.
# Keep the optional API behind HAProxy/backend; the browser only sees same-origin /api/.

server {
    listen 80;
    server_name cube.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cube.local;

    ssl_certificate     /etc/nginx/ssl/lab.crt;
    ssl_certificate_key /etc/nginx/ssl/lab.key;
    root /var/www/rubik/rubik-frontend;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
